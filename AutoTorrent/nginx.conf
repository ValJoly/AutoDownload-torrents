server {
    listen 8591;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the bridge, so the browser needs no CORS.
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://skyforge:8384;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
